<!DOCTYPE html>
<html>
<head>
    <title>Pi Soil Monitor</title>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; }
        .graph-container { background: white; margin-bottom: 30px; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <h1>Pi 4B Sensor Dashboard</h1>
    <div id="plots">
        {% for graph in graphs %}

        <button onclick="fetch_new_readings(' {{ loop.index }}')">Test Button</button>
        <form action="/get_data/{{ loop.index }}" method="post">
            <button name="backwardBtn" type="submit">Get Data</button>
            
        </form>
            <div class="graph-container">
                <div id="chart-{{ loop.index }}"></div>
                <script>
                    var spec = {{ graph | safe }};
                    Plotly.newPlot('chart-{{ loop.index }}', spec.data, spec.layout);
                </script>
            </div>
        {% endfor %}
    </div>
</body>
</html>
